<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d1712">
<title>Panel de invitados | Samuel & Mildred</title>
<style>
:root{
  --ink:#241a14; --cream:#f7f1e8; --paper:#fffaf2; --gold:#b58a4a;
  --line:#d8c7ad; --brown:#6f4d35;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
.wrap{width:min(1040px,94%);margin:0 auto;padding:50px 0 80px}
h1{font-size:clamp(28px,4vw,40px);font-weight:400;margin:0 0 6px}
.sub{font:13px/1.6 Arial,sans-serif;color:var(--brown);text-transform:uppercase;letter-spacing:.14em;margin-bottom:34px}

.login-box{max-width:380px;margin:12vh auto;padding:38px;background:var(--paper);border:1px solid var(--line)}
.login-box h1{font-size:26px;text-align:center}
label{display:block;font:600 10px Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;margin:0 0 7px;color:var(--brown)}
input{width:100%;padding:13px 12px;margin-bottom:16px;border:1px solid #cbbca7;background:#fffdf9;font:15px Georgia,serif;color:var(--ink)}
button{padding:13px 20px;border:0;background:var(--brown);color:#fff;cursor:pointer;font:600 11px Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}
button:disabled{opacity:.55;cursor:default}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.error{color:#8a2c2c;font:13px/1.5 Arial,sans-serif;margin-bottom:14px;display:none}
.error.show{display:block}

.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:28px}
.actions{display:flex;gap:10px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);margin-bottom:34px;border:1px solid var(--line)}
.stat{background:var(--paper);padding:22px;text-align:center}
.stat b{display:block;font-size:30px;font-weight:400}
.stat span{font:600 10px Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--brown)}

table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line)}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{font:600 10px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--brown);background:#f1e9db}
tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:3px 9px;font:600 10px Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;border-radius:3px}
.badge.confirmado{background:#e4ecdf;color:#3d5c33}
.badge.declinado{background:#f3ded9;color:#8a2c2c}
.empty{text-align:center;padding:50px 20px;font:14px/1.6 Arial,sans-serif;color:var(--brown)}
.table-wrap{overflow-x:auto}

@media(max-width:700px){
  .stats{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="wrap" id="loginView" style="display:none">
  <div class="login-box">
    <h1>Panel de invitados</h1>
    <form id="loginForm">
      <div class="error" id="loginError"></div>
      <label for="email">Correo</label>
      <input id="email" type="email" required autocomplete="username">
      <label for="password">Contraseña</label>
      <input id="password" type="password" required autocomplete="current-password">
      <button type="submit" id="loginBtn" style="width:100%">Entrar</button>
    </form>
  </div>
</div>

<div class="wrap" id="panelView" style="display:none">
  <div class="topbar">
    <div>
      <h1>Lista de invitados</h1>
      <div class="sub">Samuel &amp; Mildred · 30 de julio de 2027</div>
    </div>
    <div class="actions">
      <button class="ghost" id="exportBtn">Exportar CSV</button>
      <button class="ghost" id="logoutBtn">Cerrar sesión</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><b id="statConfirmados">0</b><span>Confirmados</span></div>
    <div class="stat"><b id="statPersonas">0</b><span>Personas en total</span></div>
    <div class="stat"><b id="statDeclinados">0</b><span>No asistirán</span></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Nombre</th><th>Asistencia</th><th>Personas</th><th>Mensaje</th><th>Fecha</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="emptyMsg" style="display:none">Todavía no hay respuestas.</div>
  </div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

// Mismos datos de Supabase que index.html (Settings → API).
const SUPABASE_URL = "https://srhmzhcmrlfituqqhael.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNyaG16aGNtcmxmaXR1cXFoYWVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NzQwNTcsImV4cCI6MjEwMzM1MDA1N30.FalzafFOzcjWgAFWrM8ZxsB_Avz5n3OzkWR54w4Wub0";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginView = document.getElementById("loginView");
const panelView = document.getElementById("panelView");
const loginForm = document.getElementById("loginForm");
const loginError = document.getElementById("loginError");
const loginBtn = document.getElementById("loginBtn");

let currentRows = [];

async function showPanelOrLogin() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    loginView.style.display = "none";
    panelView.style.display = "block";
    await loadInvitados();
  } else {
    loginView.style.display = "block";
    panelView.style.display = "none";
  }
}

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  loginError.classList.remove("show");
  loginBtn.disabled = true;
  loginBtn.textContent = "Entrando...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const { error } = await supabase.auth.signInWithPassword({ email, password });

  loginBtn.disabled = false;
  loginBtn.textContent = "Entrar";

  if (error) {
    loginError.textContent = "Correo o contraseña incorrectos.";
    loginError.classList.add("show");
    return;
  }
  await showPanelOrLogin();
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await supabase.auth.signOut();
  await showPanelOrLogin();
});

async function loadInvitados() {
  const { data, error } = await supabase
    .from("invitados")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    console.error(error);
    return;
  }

  currentRows = data || [];
  renderStats(currentRows);
  renderRows(currentRows);
}

function renderStats(rows) {
  const confirmados = rows.filter(r => r.asistencia === "confirmado");
  const declinados = rows.filter(r => r.asistencia === "declinado");
  const personas = confirmados.reduce((sum, r) => sum + (r.num_invitados || 0), 0);

  document.getElementById("statConfirmados").textContent = confirmados.length;
  document.getElementById("statPersonas").textContent = personas;
  document.getElementById("statDeclinados").textContent = declinados.length;
}

function renderRows(rows) {
  const tbody = document.getElementById("rows");
  const emptyMsg = document.getElementById("emptyMsg");
  tbody.innerHTML = "";

  if (!rows.length) {
    emptyMsg.style.display = "block";
    return;
  }
  emptyMsg.style.display = "none";

  for (const r of rows) {
    const tr = document.createElement("tr");
    const fecha = new Date(r.created_at).toLocaleString("es-MX", { dateStyle: "medium", timeStyle: "short" });
    tr.innerHTML = `
      <td>${escapeHtml(r.nombre)}</td>
      <td><span class="badge ${r.asistencia}">${r.asistencia === "confirmado" ? "Confirmado" : "No asiste"}</span></td>
      <td>${r.asistencia === "confirmado" ? r.num_invitados : "—"}</td>
      <td>${r.mensaje ? escapeHtml(r.mensaje) : "—"}</td>
      <td>${fecha}</td>
    `;
    tbody.appendChild(tr);
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById("exportBtn").addEventListener("click", () => {
  if (!currentRows.length) return;

  const headers = ["Nombre", "Asistencia", "Personas", "Mensaje", "Fecha"];
  const lines = [headers.join(",")];

  for (const r of currentRows) {
    const fecha = new Date(r.created_at).toLocaleString("es-MX");
    const fields = [
      r.nombre,
      r.asistencia === "confirmado" ? "Confirmado" : "No asiste",
      r.asistencia === "confirmado" ? r.num_invitados : "",
      r.mensaje || "",
      fecha
    ].map(csvEscape);
    lines.push(fields.join(","));
  }

  const csv = "﻿" + lines.join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "invitados-samuel-mildred.csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

function csvEscape(value) {
  const str = String(value ?? "");
  if (/[",\n]/.test(str)) {
    return '"' + str.replace(/"/g, '""') + '"';
  }
  return str;
}

showPanelOrLogin();
</script>
</body>
</html>
